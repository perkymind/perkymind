<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
</head>
<body>
    <img class="image-gradient" src="gradient.png" alt="gradient">
    <div class="layer-blur"></div>

    <div class="container">
        <header>
            <h1 data-aos="fade-down" data-aos-duration="1500" class="logo">perkymind</h1>

            <nav>
                <a data-aos="fade-down" data-aos-duration="1500" target="_blank" rel="noopener noreferrer" href="https://www.behance.net/perkymind">EXPERIENCE</a>
                <a data-aos="fade-down" data-aos-duration="2000" target="_blank" rel="noopener noreferrer" href="https://dribbble.com/perkymind">PRODUCT</a>
                <a data-aos="fade-down" data-aos-duration="2500" target="_blank" rel="noopener noreferrer" href="https://www.coroflot.com/tsaidavid/portfolio">GRAPHIC</a>
                <a data-aos="fade-down" data-aos-duration="3000" target="_blank" rel="noopener noreferrer" href="https://vimeo.com/perkymind">MOTION</a>
            </nav>

            <button data-aos="fade-down" data-aos-duration="1500" class="btn-signing"
                onclick="parent.open('https://www.linkedin.com/in/perkymind/')">RESUME</button>
        </header>

        <main>
            <div class="content">
                <div data-aos="fade-zoom-in"
                data-aos-easing="ease-in-back"
                data-aos-delay="300"
                data-aos-offset="0" data-aos-duration="1500" class="tag-box">
                    <div class="tag">INTRUCING &wedbar;</div>
                </div>

                <h1 data-aos="fade-zoom-in"
                data-aos-easing="ease-in-back"
                data-aos-delay="300"
                data-aos-offset="0" data-aos-duration="2000" >EMAIL FOR<br> DEVELOPERS</h1>

                <p data-aos="fade-zoom-in"
                data-aos-easing="ease-in-back"
                data-aos-delay="300"
                data-aos-offset="0" data-aos-duration="2500" class="description">
                    the best way to reach us for questions and opportunities.
                </p>

                <div data-aos="fade-zoom-in"
                data-aos-easing="ease-in-back"
                data-aos-delay="300"
                data-aos-offset="0" data-aos-duration="3000" class="buttons">
                    <a href="#" class="btn-get-started">Documentation &gt;</a>
                    <a href="#" class="btn-signing-main">Get Started &gt;</a>
                </div>
            </div>
        </main>
    </div>

      <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
  <script>
    AOS.init();
  </script>

</body>
</html>
